invoker.systemPropertiesFile = test.properties

# Signs the jar with a classic (gpg) and a PQC (sq) block
invoker.goals.1 = package sigmund:sign

# Verifies with the project's sigmund.yaml, whose default toolchain checks both blocks
invoker.goals.2 = sigmund:verify-signature -Dfile=target/sign-verify-roundtrip-1.0-SNAPSHOT.jar -Dsignature=target/sign-verify-roundtrip-1.0-SNAPSHOT.jar.asc

# A named gpg-only configuration cannot check the PQC block, which fails strict verification
invoker.goals.3 = sigmund:verify-signature -Dfile=target/sign-verify-roundtrip-1.0-SNAPSHOT.jar -Dsignature=target/sign-verify-roundtrip-1.0-SNAPSHOT.jar.asc -Dsigmund.trustConfig=gpg-only.yaml
invoker.buildResult.3 = failure
