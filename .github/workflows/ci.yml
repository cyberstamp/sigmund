name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Ubuntu 26.04 ships OpenSSL 3.5 with native PQC support (ML-KEM, ML-DSA, SLH-DSA),
    # which eliminates the need to build OpenSSL from source.
    runs-on: ubuntu-26.04

    env:
      SQ_VERSION: '1.4.0'
      # Build sq against the system OpenSSL 3.5 for PQC algorithm support.
      # The distro-packaged sq (1.3.1) uses the Nettle backend, which lacks PQC.
      SQ_CARGO_FEATURES: crypto-openssl

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install sq build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cargo rustc gcc clang libsqlite3-dev libssl-dev \
            pkg-config nettle-dev capnproto

      - name: Cache sq build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/sq-build
          key: sq-build-${{ env.SQ_VERSION }}-${{ env.SQ_CARGO_FEATURES }}-${{ runner.os }}

      - name: Build and install sq
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if sq version 2>/dev/null | grep -q "$SQ_VERSION"; then
            echo "sq $SQ_VERSION already installed"
          else
            CARGO_TARGET_DIR=~/sq-build \
              cargo install "sequoia-sq@$SQ_VERSION" \
                --features "$SQ_CARGO_FEATURES" --no-default-features --force
          fi
          sq version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up GPG test key
        run: |
          gpg --batch --gen-key <<EOF
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: CI Test
          Name-Email: ci@sigmund.test
          Expire-Date: 0
          EOF

      - name: Build and test
        run: mvn verify

      - name: Verify PQC integration tests ran
        run: |
          report=core/target/surefire-reports/dev.cyberstamp.sigmund.core.RoundTripIntegrationTest.txt
          if [ ! -f "$report" ] || ! grep 'Tests run:' "$report" | grep -qvE 'Tests run: 0,'; then
            echo "::error::RoundTripIntegrationTest was not executed — PQC tests were silently skipped"
            exit 1
          fi
